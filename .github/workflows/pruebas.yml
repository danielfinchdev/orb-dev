# Tests on every push and pull request, on Windows and Linux (the engine and the interface's logic). Publishes nothing:
# release builds are made by release.yml when the version changes on main. Read-only token; actions pinned by commit.
name: Tests

on:
  push:
    branches: [main, 'orb-*']
  pull_request:

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pruebas:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      # The Windows runners' system drive (where %TEMP% is) is many times slower than their work drive: the database
      # tests (VACUUM, fsync, copies) took 10-25 s each there instead of under 2 s, and the migration file passed or
      # hit its 180 s limit depending on the run. Their temp folders go on the work drive.
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - run: npm ci
      - run: npm run check
      - run: npm test
        timeout-minutes: 20
