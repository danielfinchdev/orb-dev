# Tests on every push and pull request, on Windows and Linux (also the whole app with Electron on both). Publishes nothing: releases are
# built by release.yml when the version changes on main.
name: Pruebas

on:
  push:
    branches: [main, 'orb-*']
  pull_request:

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
        timeout-minutes: 20
      # 3.7: the whole app with Electron on both systems (Linux has no screen: a virtual one).
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: La app entera con Electron
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a ' || '' }}npm run test:app
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: capturas-${{ matrix.os }}
          path: test-results/
