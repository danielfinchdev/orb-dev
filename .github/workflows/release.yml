# The Windows download, published as a GitHub release when "version" in package.json changes on main:
#   Orb-<versión>-instalador.exe   installs for the user and updates itself (latest.yml)
# Tests run on pull requests (pruebas.yml), not here. The Android APK, Orb Server (Linux) and the terminal client are built
# and signed on the owner's PC and added to the same release (Orb Server's manifest is signed with the offline key).
name: Versión para Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: version-windows
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      new: ${{ steps.v.outputs.new }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: ¿Versión nueva?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "new=false" >> "$GITHUB_OUTPUT"; else echo "new=true" >> "$GITHUB_OUTPUT"; fi


  windows:
    needs: version
    if: needs.version.outputs.new == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: La app nunca sale con la suma de install.sh de relleno
        run: node scripts/release.mjs check-server-release
      - name: Construir el instalador
        run: npx vite build && npx electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: orb-dev-windows
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml

  publicar:
    needs: [version, windows]
    if: needs.version.outputs.new == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: orb-dev-*
          merge-multiple: true
      - name: Publicar la versión
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Orb ${{ needs.version.outputs.version }}
          make_latest: true
          body_path: docs/CHANGELOG.md
          files: |
            dist/Orb-*.exe
            dist/Orb-*.blockmap
            dist/latest.yml
