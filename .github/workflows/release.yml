# The desktop downloads, built and checked on a real machine of each system and published together as a GitHub release:
#   Orb-<version>-instalador.exe      Windows (Tauri): installs for the user and updates itself; the same file as
#                                     Orb_<version>_x64-setup.exe, which the updaters download:
#                                     latest.json + .sig for Orb on Tauri (signed with the updater key, secrets
#                                     TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD), latest.yml for
#                                     Orb 3.8.0 (Electron), whose updater installs it and is replaced by it
#   Orb-<version>-linux-<arch>.AppImage  Linux, nothing to install, updates itself (latest-linux*.yml)
#   Orb-<version>-linux-<arch>.deb       Linux (Debian, Ubuntu…), installed with the system; it tells of new versions
# Publishing a version = changing "version" in package.json on main: when that version has no release yet, this builds it,
# tests it (also the packaged app on Windows and Linux) and publishes it as release v<version>, creating the tag. From the Actions
# tab ("Run workflow") it does the same; a version already published is only built and checked (files kept in the run).
# The Android app (Orb-<version>-android.apk) is built and signed on the owner's PC (npm run android:build, its signing
# key never leaves it) and attached to the release by hand.
name: Release for Windows and Linux

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: version-windows
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      new: ${{ steps.v.outputs.new }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: New version?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "new=false" >> "$GITHUB_OUTPUT"; else echo "new=true" >> "$GITHUB_OUTPUT"; fi

  pruebas:
    needs: version
    if: needs.version.outputs.new == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
        timeout-minutes: 20
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: The whole app with Electron
        run: xvfb-run -a -s "-screen 0 1920x1080x24" npm run test:app
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-screenshots
          path: test-results/

  windows:
    needs: [version, pruebas]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Build the installer (Tauri), signed for the updater
        run: npm run tauri:build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Update manifests (latest.json for Orb on Tauri, latest.yml for Orb 3.8.0)
        shell: bash
        run: node scripts/release-manifests.mjs --setup "src-tauri/target/release/bundle/nsis/Orb_${{ needs.version.outputs.version }}_x64-setup.exe" --out dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orb-dev-windows
          path: |
            dist/Orb_*_x64-setup.exe
            dist/Orb_*_x64-setup.exe.sig
            dist/Orb-*-instalador.exe
            dist/latest.json
            dist/latest.yml

  # The Linux app (AppImage and .deb, x64 and arm64), built on Ubuntu; the x64 one is opened and checked like on Windows.
  linux:
    needs: [version, pruebas]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the AppImage and the .deb
        run: npx vite build && npx electron-builder --linux AppImage deb --x64 --arm64 --publish never
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Test the packaged app on Linux
        run: xvfb-run -a node test/smoke.e2e.mjs
        env:
          ORB_E2E_EXE: dist/linux-unpacked/orb-dev
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orb-dev-linux
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/latest-linux*.yml
            test-results/

  # One release with every file, once both systems are built and checked.
  publicar:
    needs: [version, windows, linux]
    if: needs.version.outputs.new == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: orb-dev-*
          merge-multiple: true
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Orb ${{ needs.version.outputs.version }}
          make_latest: true
          body_path: docs/CHANGELOG.md
          files: |
            dist/Orb_*_x64-setup.exe
            dist/Orb_*_x64-setup.exe.sig
            dist/Orb-*-instalador.exe
            dist/latest.json
            dist/latest.yml
            dist/Orb-*.AppImage
            dist/Orb-*.deb
            dist/latest-linux*.yml
