# The Windows downloads, built and checked on a real Windows machine and published as a GitHub release:
#   Orb.dev-<versión>-portable.exe  one file, nothing to install: double-click and it opens
#   Orb.dev-<versión>-windows.zip   the same, already unpacked (starts faster): extract and open Orb.dev.exe
# Publishing a version = changing "version" in package.json on main: when that version has no release yet, this builds it,
# tests it (also the packaged app on Windows) and publishes it as release v<version>, creating the tag. From the Actions
# tab ("Run workflow") it does the same; a version already published is only built and checked (files kept in the run).
name: Versión para Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: version-windows
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      new: ${{ steps.v.outputs.new }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: ¿Versión nueva?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "new=false" >> "$GITHUB_OUTPUT"; else echo "new=true" >> "$GITHUB_OUTPUT"; fi

  pruebas:
    needs: version
    if: needs.version.outputs.new == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: La app entera con Electron
        run: xvfb-run -a npm run test:app
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: capturas-pruebas
          path: test-results/

  windows:
    needs: [version, pruebas]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Construir el instalador, el portable y el zip
        run: npx vite build && npx electron-builder --win nsis portable zip --x64 --publish never
      - name: Probar la app empaquetada en Windows
        run: node test/smoke.e2e.mjs
        env:
          ORB_E2E_EXE: dist/win-unpacked/Orb.dev.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orb-dev-windows
          path: |
            dist/*.exe
            dist/*.zip
            test-results/
      - name: Publicar la versión
        if: needs.version.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Orb.dev ${{ needs.version.outputs.version }}
          make_latest: true
          body_path: docs/NOVEDADES.md
          files: |
            dist/Orb.dev-*.exe
            dist/Orb.dev-*.zip
