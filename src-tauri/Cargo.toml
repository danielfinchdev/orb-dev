[package]
name = "orb"
version = "3.8.0"
description = "Orb: one app for your AI coding agents"
authors = ["Orb"]
license = "MIT"
edition = "2021"
rust-version = "1.85"

[lib]
name = "orb_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Test and measurement builds only: the window's DevTools port (ORB_E2E_CDP_PORT) and a window never shown
# (ORB_HIDDEN_WINDOW=1), both only with a separate data folder (ORB_USER_DATA).
e2e = []

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = [] }
tauri-plugin-single-instance = "=2.5.4"
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-opener = "=2.7.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
