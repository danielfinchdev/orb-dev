[package]
name = "orb-vault"
version = "3.8.3"
description = "Orb's master password and secrets, kept out of the engine (src/domain/security/master.mjs talks to it)"
authors = ["Orb"]
license = "MIT"
edition = "2021"
rust-version = "1.85"

[lib]
name = "orb_vault"
path = "src/lib.rs"

# The tests' copy of the vault: npm test starts it for every engine and test file (src/domain/security/master.mjs › connect);
# Orb.exe runs the same code in its own process (src-tauri/src/vault_host.rs).
[[bin]]
name = "orb-vault"
path = "src/bin/orb-vault.rs"

[dependencies]
serde_json = "1"
base64 = "=0.22.1"
chacha20poly1305 = { version = "=0.10.1", features = ["getrandom"] }
x25519-dalek = { version = "=2.0.1", features = ["static_secrets", "zeroize"] }
hkdf = "=0.12.4"
hmac = "=0.12.1"
sha2 = "=0.10.9"
scrypt = { version = "=0.11.0", default-features = false }
zeroize = "=1.9.1"
subtle = "=2.6.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Memory", "Win32_System_Pipes", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
