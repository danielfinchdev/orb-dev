const HUES = { azul: 264, lila: 300, rosa: 350, coral: 28, ambar: 75, verde: 150, menta: 180, cielo: 225 };

function avatar(shape = 'esfera', color = 'azul', size = 44) {
  const h = HUES[color] ?? 264; const id = `g${shape}${color}${size}${Math.random().toString(36).slice(2, 6)}`;
  const body = shape === 'gota' ? '<path d="M50 10c19 18 32 33 32 50a32 32 0 0 1-64 0c0-17 13-32 32-50z" fill="url(#B)"/>' : '<circle cx="50" cy="54" r="34" fill="url(#B)"/>';
  const cy = shape === 'gota' ? 60 : 54;
  const extra = {
    cascos: `<rect x="9" y="${cy - 12}" width="12" height="24" rx="6" fill="oklch(0.62 0.13 ${h})"/><rect x="79" y="${cy - 12}" width="12" height="24" rx="6" fill="oklch(0.62 0.13 ${h})"/>`,
    antena: `<path d="M50 20V8" stroke="oklch(0.5 0.12 ${h})" stroke-width="4" stroke-linecap="round"/><circle cx="50" cy="8" r="6" fill="oklch(0.75 0.16 ${(h + 40) % 360})"/>`,
    anillo: `<ellipse cx="50" cy="${cy + 4}" rx="47" ry="11" fill="none" stroke="oklch(0.78 0.12 ${(h + 30) % 360})" stroke-width="5" transform="rotate(-14 50 ${cy})"/>`,
    visera: '', esfera: '', gota: ''
  }[shape];
  const visor = shape === 'visera'
    ? `<rect x="22" y="${cy - 13}" width="56" height="26" rx="13" fill="oklch(0.22 0.06 ${h})"/>`
    : `<ellipse cx="50" cy="${cy}" rx="22" ry="16" fill="oklch(0.22 0.06 ${h})"/>`;
  const eyes = `<rect x="38" y="${cy - 7}" width="7" height="14" rx="3.5" fill="#8cf6ff"/><rect x="55" y="${cy - 7}" width="7" height="14" rx="3.5" fill="#8cf6ff"/>`;
  return `<svg width="${size}" height="${size}" viewBox="0 0 100 100" aria-hidden="true" style="flex:none"><defs><radialGradient id="B" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="oklch(0.93 0.06 ${h})"/><stop offset=".55" stop-color="oklch(0.74 0.14 ${h})"/><stop offset="1" stop-color="oklch(0.55 0.16 ${h})"/></radialGradient></defs>${shape === 'anillo' ? '' : ''}${extra && shape !== 'anillo' ? extra : ''}${body}${shape === 'anillo' ? extra : ''}${visor}${eyes}<ellipse cx="38" cy="${cy - 22}" rx="10" ry="5" fill="#fff" opacity=".45"/></svg>`.replaceAll('url(#B)', `url(#${id})`).replace('id="B"', `id="${id}"`);
}

  <div class="group">${r('file', 'Archivos', '5')}${r('export', 'Exportar el chat', '', false)}${r('trash', 'Eliminar el chat', '', false, 'danger')}</div>
  </div>`;
}
function createBot(phone) {
  const shape = 'cascos', color = 'lila';
  return `<div style="display:grid;justify-items:center;gap:6px;padding:${phone ? '6px 0 4px' : '0'}">${avatar(shape, color, phone ? 150 : 132)}<span class="muted" style="font-size:12px">Vista previa</span></div>
  <div class="field"><span class="label" style="text-transform:none;letter-spacing:0;font-size:13px;color:var(--foreground)">Nombre</span><span class="in">Lector</span></div>
  <div class="field"><span style="font-size:13px;font-weight:500">Forma</span><div class="shapes">${SHAPES.map((s) => `<span class="${s === shape ? 'on' : ''}">${avatar(s, color, phone ? 40 : 44)}</span>`).join('')}</div></div>
  <div class="field"><span style="font-size:13px;font-weight:500">Color</span><div class="colors">${Object.keys(HUES).map((c) => `<span class="${c === color ? 'on' : ''}" style="background:radial-gradient(circle at 35% 30%,oklch(0.9 0.06 ${HUES[c]}),oklch(0.62 0.15 ${HUES[c]}))"></span>`).join('')}</div></div>
  <div class="field"><span style="font-size:13px;font-weight:500">Qué hará <span class="muted" style="font-weight:400">(opcional)</span></span><span class="in ph" style="height:64px;align-items:flex-start;padding-top:10px">Resume los artículos que le envío…</span></div>`;
}

// ---- layouts ----
const app = document.getElementById('app');
const zoneSeg = (z) => `<div class="seg"><span class="${z === 'orb' ? 'on' : ''}">${ic('sparkles')}Orb</span><span class="${z === 'bots' ? 'on' : ''}">${ic('bot')}Bots</span></div>`;
function desktop() {
  const info = S === 'info';
  const places = Z === 'bots' ? [['bell', 'Recordatorios'], ['home', 'Casa'], ['book', 'Memoria'], ['server', 'Servidor']] : [['tasks', 'Tareas'], ['folder', 'Proyectos'], ['cal', 'Programadas'], ['pen', 'Pizarra']];
  const left = `<aside class="left"><div class="head"><span class="row" style="gap:8px">${robot(26)}<span class="wordmark">ORB<b></b>E</span></span><span class="grow"></span><span class="icon-btn">${ic('sun')}</span><span class="icon-btn">${ic('side')}</span></div>
    <div style="padding:0 12px 10px">${zoneSeg(Z)}</div>
    <div class="row" style="padding:0 12px 8px;gap:8px"><div class="search grow">${ic('search')}Buscar</div><span class="btn primary" style="width:36px;padding:0">${ic(Z === 'bots' ? 'plus' : 'chat')}</span></div>
    <div class="places">${places.map(([i, l]) => `<span>${ic(i)}${l}</span>`).join('')}</div>
    <div class="list">${Z === 'bots' ? botsList(false) : orbList(false)}</div>
    <div class="foot"><span class="tog">${ic('up')}</span><span class="fi">${ic('gear')}</span><span class="fi">${ic('bot')}</span><span class="fi">${ic('book')}</span><span class="fi">${ic('cap')}</span><span class="grow"></span><span class="fi">${ic('bug')}</span><span class="v">v3.6.0</span></div></aside>`;
  const head = chatHead(Z, false, info).replace('<span class="icon-btn">' + ic('more') + '</span></div>', `<span class="icon-btn">${ic('more')}</span><span class="wincontrols">${info ? '' : `<span>${ic('min')}</span><span>${ic('max')}</span><span>${ic('x')}</span>`}</span></div>`);
  const center = `<section class="chat">${head}${Z === 'bots' ? botsChat(false) : orbChat(false)}</section>`;
  const right = info ? `<aside class="info" style="position:relative"><div class="wincontrols" style="position:absolute;top:12px;right:8px;z-index:1"><span>${ic('min')}</span><span>${ic('max')}</span><span>${ic('x')}</span></div>${Z === 'bots' ? botInfo(false).replace(`<span class="icon-btn">${ic('x')}</span>`, '') : orbInfo(false).replace(`<span class="icon-btn">${ic('x')}</span>`, '')}</aside>` : '';
  app.innerHTML = `<div class="desk ${info ? 'withinfo' : ''}">${left}${center}${right}</div>`;
  if (S === 'create') app.innerHTML += `<div class="modal-scrim"><div class="modal"><div class="row"><span style="font-size:18px;font-weight:600" class="grow">Nuevo bot</span><span class="icon-btn">${ic('x')}</span></div>${createBot(false)}<div class="row" style="justify-content:flex-end"><span class="btn ghost">Cancelar</span><span class="btn primary">Crear bot</span></div></div></div>`;
}
function phone() {
  const tabs = Z === 'bots' ? [['chats', 'Chats', true], ['bell', 'Recordatorios'], ['home', 'Casa']] : [['chats', 'Chats', true], ['tasks', 'Tareas', false, 1], ['folder', 'Proyectos']];
  const tabbar = `<nav class="tabs">${tabs.map(([i, l, on, n]) => `<span class="${on ? 'on' : ''}"><i>${ic(i)}</i>${l}${n ? `<b class="cnt">${n}</b>` : ''}</span>`).join('')}</nav>`;
  let body;
  if (S === 'list') body = `<div class="ph-head"><span class="icon-btn" style="color:var(--foreground)">${ic('menu')}</span><span class="ttl grow">${Z === 'bots' ? 'Bots' : 'Orb'}</span></div>
    <div class="ph-body"><div class="search" style="margin:2px 2px 10px">${ic('search')}${Z === 'bots' ? 'Buscar bots y mensajes' : 'Buscar chats y proyectos'}</div>${Z === 'bots' ? botsList(true) : orbList(true)}</div>
    <span class="fab">${ic(Z === 'bots' ? 'plus' : 'chat')}</span>${tabbar}`;
  else if (S === 'chat') body = `<section class="chat">${chatHead(Z, true)}${Z === 'bots' ? botsChat(true) : orbChat(true)}</section>`;
  else if (S === 'info') body = `<aside class="info">${Z === 'bots' ? botInfo(true) : orbInfo(true)}</aside>`;
  else body = `<div class="chat-head" style="border:0;background:transparent"><span class="icon-btn">${ic('x')}</span><span class="grow" style="text-align:center;font-weight:600">Nuevo bot</span><span style="width:36px"></span></div><div style="flex:1;padding:4px 18px;display:grid;gap:16px;align-content:start;overflow:hidden">${createBot(true)}</div><div style="padding:0 18px 22px"><span class="btn primary" style="width:100%;height:48px;border-radius:14px;font-size:15px">Crear bot</span></div>`;
  app.innerHTML = `<div class="phone">${body}</div>`;
}
(D === 'desktop' ? desktop : phone)();
</script>
</body>
</html>
